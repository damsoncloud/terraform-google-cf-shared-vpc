---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns:
          - '*'
    # Upgraded with devenvbase by the dcp.sdlc upgrade workflow
    ignore:
      - dependency-name: damsoncloud/dcp.sdlc*

  - package-ecosystem: terraform
    directories:
      - /
      - /modules/*
      - /examples/*
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      terraform:
        patterns:
          - '*'
