---
inputs:
  devenvbase:
    url: github:damsoncloud/dcp.sdlc/v2.3.0?dir=devenvbase
    flake: false
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
  nixpkgs-terraform:
    url: github:stackbuilders/nixpkgs-terraform

imports:
  - devenvbase
